# end converted restore_cfg.psv entries
[waybar]
pre_command = "echo 'Pre commands '"
post_command = "echo 'HyDE backed up!'"

[[waybar.dependency]]
# Keep the minimum version for Arch package managers; Fedora uses its current
# Waybar build from the enabled repositories.
pacman = ["waybar\\>=0.15.0"]
yay = ["waybar\\>=0.15.0"]
paru = ["waybar\\>=0.15.0"]
dnf = ["waybar"]

[[waybar.files]]
action = "preserve"
source_root = "Configs/.config/waybar"
target_root = "${XDG_CONFIG_HOME}/waybar"
paths = ["config.jsonc", "theme.css", "style.css", "user-style.css"]

# [[waybar.files]]
# action = "preserve"
# source_root = "Configs/.config/waybar"
# target_root = "${XDG_CONFIG_HOME}/waybar"
# paths = ["modules", "styles", "layouts", "menus"]

[[waybar.files]]
action = "sync"
source_root = "Configs/.local/share/waybar"
target_root = "${XDG_DATA_HOME}/waybar"
paths = ["includes", "modules", "styles", "layouts", "menus"]
# swaync_config (Scripts/dots/swaync-config.toml) owns this one file, since it
# only exists when that optional dot is deployed; claiming it here too made
# every swaync_config deploy fail with "File conflict: .../menus/swaync.xml
# (owned by waybar)" (#2103).
ignored_paths = ["menus/swaync.xml"]
