[electron-flags]
    description = "electron flags for wayland"


[[electron-flags.dependency]]
    pacman = [ "electron" ]
    # bash is present on Fedora and keeps this dependency block selectable
    # without trying to install Electron from a repository Fedora does not ship.
    dnf = [ "bash" ]

[[electron-flags.files]]
    action      = "preserve"
    paths       = "electron-flags.conf"
    source_root = "Configs/.config"
    target_root = "${XDG_CONFIG_HOME}"
