
[swaync]
    description = "Optional SwayNC notification daemon (alternative to Dunst)"
[[swaync.dependency]]
    pacman = [ "swaync" ]

[[swaync.files]]
    action      = "sync"
    source_root = "Configs/.config"
    target_root = "${XDG_CONFIG_HOME}"

    paths = [
        "swaync",
        "waybar/menus/swaync.xml",
    ]
