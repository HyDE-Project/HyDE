[wezterm]
    description = "A GPU-accelerated cross-platform terminal emulator and multiplexer"

[[wezterm.dependency]]
    dnf    = [ "wezterm" ]
    pacman = [ "wezterm" ]

[[wezterm.files]]
    action      = "sync"
    paths       = "wezterm/hyde.lua"
    source_root = "Configs/.config/"
    target_root = "${XDG_CONFIG_HOME}"

[[wezterm.files]]
    action      = "preserve"
    paths       = "wezterm/wezterm.lua"
    source_root = "Configs/.config/"
    target_root = "${XDG_CONFIG_HOME}"

# The colour template ships with the wallbash tree that hyde.toml already syncs,
# so it needs no entry here. There is no apply hook: WezTerm reloads on its own
# through the watch list in hyde.lua.
