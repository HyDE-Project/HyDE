[wezterm]
    description = "A GPU-accelerated cross-platform terminal emulator and multiplexer"

[[wezterm.dependency]]
    dnf    = [ "wezterm" ]
    pacman = [ "wezterm" ]

[[wezterm.files]]
    action      = "sync"
    paths       = "wezterm/hyde.lua"
    source_root = "Configs/.config/"
    target_root = "${XDG_CONFIG_HOME}"

[[wezterm.files]]
    action      = "preserve"
    paths       = "wezterm/wezterm.lua"
    source_root = "Configs/.config/"
    target_root = "${XDG_CONFIG_HOME}"

# The colour template and its apply hook ship with the wallbash tree that
# hyde.toml already syncs, so they need no entry here.
