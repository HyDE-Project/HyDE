codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  range: "40...80"
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 80%
        threshold: 0%
        informational: true

flags:
  shell:
    paths:
      - Scripts/
      - Configs/.local/bin/
      - Configs/.local/lib/hyde/
    carryforward: true

comment:
  layout: "condensed_header, diff, flags, components, files"
  behavior: default
  require_changes: true
  hide_project_coverage: false

ignore:
  - "tests/**"
  - "docs/**"
  - "**/*.dcol"
  - "**/*.Xcol"
  - "**/*.t2"
  - "**/*.theme"
  - "**/*.conf"
  - "**/*.jsonc"
  - "**/*.toml"
  - "Configs/.config/**"
  - "Configs/.local/share/hyde/**"
  - "Configs/.local/share/wallbash/**"
  - "Configs/.local/share/waybar/**"
  - "Scripts/nvidia-db/**"
  - "Source/**"
