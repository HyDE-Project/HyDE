name: Tests

on:
  push:
    branches:
      - dev
      - rc
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Configuration and script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4 liblua5.4-dev luarocks shellcheck fish
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
          sudo ln -sf /usr/bin/luac5.4 /usr/local/bin/luac
          # gpuinfo.lua (and several other shipped scripts) require "lfs" at
          # load time. On a real install this comes from hyde-shell luainit's
          # own luarocks-managed tree; CI has no such tree, so give plain
          # lua5.4 the same module via its default system rocks path instead.
          # --lua-version=5.4 alone isn't enough: Ubuntu's luarocks package
          # can't locate liblua5.4-dev's headers on its own. Debian's
          # lua5.4.pc reports `includedir` as the bare /usr/include prefix
          # and only appends the versioned subdirectory in its own Cflags
          # field, so `pkg-config --variable=includedir` alone isn't the
          # real header path either -- confirmed against this runner via
          # `dpkg -L liblua5.4-dev`, which lists the headers under
          # <includedir>/lua5.4 (e.g. /usr/include/lua5.4/lua.h).
          sudo luarocks --lua-version=5.4 install luafilesystem \
            LUA_INCDIR="$(pkg-config --variable=includedir lua5.4)/lua5.4" \
            LUA_LIBDIR="$(pkg-config --variable=libdir lua5.4)"

      - name: Report tool versions
        run: |
          lua -v
          shellcheck --version
          fish --version
          python3 --version

      - name: Run the test suite
        run: sh tests/run.sh

  coverage:
    name: Shell coverage
    runs-on: ubuntu-latest
    needs: test
    env:
      KCOV_VERSION: v43
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install test and coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lua5.4 liblua5.4-dev luarocks shellcheck fish \
            binutils-dev build-essential cmake ninja-build libssl-dev \
            libcurl4-openssl-dev libelf-dev zlib1g-dev libdw-dev libiberty-dev
          sudo luarocks --lua-version=5.4 install luafilesystem \
            LUA_INCDIR="$(pkg-config --variable=includedir lua5.4)/lua5.4" \
            LUA_LIBDIR="$(pkg-config --variable=libdir lua5.4)"
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
          sudo ln -sf /usr/bin/luac5.4 /usr/local/bin/luac

      - name: Build the coverage tool
        run: |
          git clone --depth 1 --branch "$KCOV_VERSION" https://github.com/SimonKagstrom/kcov.git "$RUNNER_TEMP/kcov"
          cmake -S "$RUNNER_TEMP/kcov" -B "$RUNNER_TEMP/kcov/build" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/kcov/build"
          sudo install -m 0755 "$RUNNER_TEMP/kcov/build/src/kcov" /usr/local/bin/kcov

      - name: Measure the suite
        run: |
          mkdir -p coverage
          kcov \
            --include-path=Scripts,Configs/.local/bin,Configs/.local/lib/hyde \
            --exclude-pattern=/tests/ \
            coverage sh tests/run.sh

      - name: Upload the report
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          flags: shell
          name: shell
          fail_ci_if_error: false
