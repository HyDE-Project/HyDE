name: Tests

on:
  push:
    branches:
      - dev
      - rc
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Rejects a PR that moves the `tests` submodule pointer outside the
  # dedicated tests-pointer.yml automation. test.yml never reads this
  # pointer (it always resolves the tests repo fresh by branch name below),
  # so a feature branch bumping it buys nothing and only sets up a
  # submodule merge conflict with whatever tests-pointer.yml lands on dev
  # concurrently (HyDE-Project/HyDE#2175 hit exactly this).
  #
  # The ci/tests-pointer exemption is also bound to the upstream repo: a
  # fork PR could otherwise name its own branch ci/tests-pointer and skip
  # this check, even though the real automation only ever runs here
  # (CodeRabbit catch on HyDE-Project/HyDE#2178).
  tests-pointer-guard:
    name: Tests submodule pointer guard
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev' && (github.head_ref != 'ci/tests-pointer' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject tests submodule pointer changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          # Compare against the merge-base, not dev's current tip: tests-pointer.yml
          # keeps moving dev's pointer forward after a feature branch forks off it,
          # and that drift must not look like a pointer change the PR itself made
          # (CodeRabbit catch on HyDE-Project/HyDE#2178).
          merge_base=$(git merge-base "$BASE_SHA" HEAD)
          base_pointer=$(git ls-tree "$merge_base" tests | awk '{print $3}')
          head_pointer=$(git ls-tree HEAD tests | awk '{print $3}')
          if [ "$base_pointer" != "$head_pointer" ]; then
            echo "::error::This PR moves the 'tests' submodule pointer ($base_pointer -> $head_pointer) relative to where it branched from dev. test.yml resolves the tests repo fresh by branch name (see tests-pointer.yml), so this commit isn't needed for CI and only risks a submodule merge conflict with the automated 'Tests pointer' workflow. Drop the pointer-bump commit; ci/tests-pointer updates dev separately."
            exit 1
          fi

  test:
    name: Configuration and script checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Resolve test repository and branch
        id: resolve-tests
        env:
          REPO_OWNER: HyDE-Project
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          FORK_OWNER: ${{ github.event.pull_request.head.repo.owner.login || '' }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -eu

          target_owner="$REPO_OWNER"
          target_branch="main"

          branch_exists() {
            git ls-remote --heads --exit-code "https://github.com/$1/tests.git" "refs/heads/$2" >/dev/null 2>&1
          }

          if branch_exists "$REPO_OWNER" "$BRANCH_NAME"; then
            target_owner="$REPO_OWNER"
            target_branch="$BRANCH_NAME"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$REPO_FULL" ] && [ -n "$FORK_OWNER" ] && branch_exists "$FORK_OWNER" "$BRANCH_NAME"; then
            target_owner="$FORK_OWNER"
            target_branch="$BRANCH_NAME"
          fi

          echo "owner=$target_owner" >> "$GITHUB_OUTPUT"
          echo "branch=$target_branch" >> "$GITHUB_OUTPUT"
          echo "Using tests from $target_owner/tests:$target_branch"

      - name: Checkout tests repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.resolve-tests.outputs.owner }}/tests
          ref: ${{ steps.resolve-tests.outputs.branch }}
          path: tests
          persist-credentials: false
          fetch-depth: 1

      - name: Require test suite
        run: test -f tests/run.sh

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4 lua-filesystem lua-socket lua-argparse lua-dkjson shellcheck fish
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
          sudo ln -sf /usr/bin/luac5.4 /usr/local/bin/luac

      - name: Report tool versions
        run: |
          lua -v
          shellcheck --version
          fish --version
          python3 --version

      - name: Run the test suite
        run: sh tests/run.sh

  coverage:
    name: Shell coverage
    runs-on: ubuntu-latest
    needs: test
    env:
      KCOV_VERSION: v43
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Resolve test repository and branch
        id: resolve-tests
        env:
          REPO_OWNER: HyDE-Project
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          FORK_OWNER: ${{ github.event.pull_request.head.repo.owner.login || '' }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -eu

          target_owner="$REPO_OWNER"
          target_branch="main"

          branch_exists() {
            git ls-remote --heads --exit-code "https://github.com/$1/tests.git" "refs/heads/$2" >/dev/null 2>&1
          }

          if branch_exists "$REPO_OWNER" "$BRANCH_NAME"; then
            target_owner="$REPO_OWNER"
            target_branch="$BRANCH_NAME"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$REPO_FULL" ] && [ -n "$FORK_OWNER" ] && branch_exists "$FORK_OWNER" "$BRANCH_NAME"; then
            target_owner="$FORK_OWNER"
            target_branch="$BRANCH_NAME"
          fi

          echo "owner=$target_owner" >> "$GITHUB_OUTPUT"
          echo "branch=$target_branch" >> "$GITHUB_OUTPUT"
          echo "Using tests from $target_owner/tests:$target_branch"

      - name: Checkout tests repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.resolve-tests.outputs.owner }}/tests
          ref: ${{ steps.resolve-tests.outputs.branch }}
          path: tests
          persist-credentials: false
          fetch-depth: 1

      - name: Install test and coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lua5.4 shellcheck fish \
            binutils-dev build-essential cmake ninja-build libssl-dev \
            libcurl4-openssl-dev libelf-dev zlib1g-dev libdw-dev libiberty-dev
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
          sudo ln -sf /usr/bin/luac5.4 /usr/local/bin/luac

      - name: Build the coverage tool
        run: |
          git clone --depth 1 --branch "$KCOV_VERSION" https://github.com/SimonKagstrom/kcov.git "$RUNNER_TEMP/kcov"
          cmake -S "$RUNNER_TEMP/kcov" -B "$RUNNER_TEMP/kcov/build" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/kcov/build"
          sudo install -m 0755 "$RUNNER_TEMP/kcov/build/src/kcov" /usr/local/bin/kcov

      - name: Measure the suite
        run: |
          mkdir -p coverage
          kcov \
            --include-path=Scripts,Configs/.local/bin,Configs/.local/lib/hyde \
            --exclude-pattern=/tests/ \
            coverage sh tests/run.sh

      - name: Upload the report
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          flags: shell
          name: shell
          fail_ci_if_error: false
