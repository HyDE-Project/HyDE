name: Tests

on:
  push:
    branches:
      - dev
      - rc
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Rejects a PR that moves the `tests` submodule pointer outside the
  # dedicated tests-pointer.yml automation. test.yml never reads this
  # pointer (it always resolves the tests repo fresh by branch name below),
  # so a feature branch bumping it buys nothing and only sets up a
  # submodule merge conflict with whatever tests-pointer.yml lands on dev
  # concurrently (HyDE-Project/HyDE#2175 hit exactly this).
  #
  # The ci/tests-pointer exemption is also bound to the upstream repo: a
  # fork PR could otherwise name its own branch ci/tests-pointer and skip
  # this check, even though the real automation only ever runs here
  # (CodeRabbit catch on HyDE-Project/HyDE#2178).
  tests-pointer-guard:
    name: Tests submodule pointer guard
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev' && (github.head_ref != 'ci/tests-pointer' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject tests submodule pointer changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          # Compare against the merge-base, not dev's current tip: tests-pointer.yml
          # keeps moving dev's pointer forward after a feature branch forks off it,
          # and that drift must not look like a pointer change the PR itself made
          # (CodeRabbit catch on HyDE-Project/HyDE#2178).
          merge_base=$(git merge-base "$BASE_SHA" HEAD)
          base_pointer=$(git ls-tree "$merge_base" tests | awk '{print $3}')
          head_pointer=$(git ls-tree HEAD tests | awk '{print $3}')
          if [ "$base_pointer" != "$head_pointer" ]; then
            echo "::error::This PR moves the 'tests' submodule pointer ($base_pointer -> $head_pointer) relative to where it branched from dev. test.yml resolves the tests repo fresh by branch name (see tests-pointer.yml), so this commit isn't needed for CI and only risks a submodule merge conflict with the automated 'Tests pointer' workflow. Drop the pointer-bump commit; ci/tests-pointer updates dev separately."
            exit 1
          fi

  test:
    name: Configuration and script checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Resolve test repository and branch
        id: resolve-tests
        env:
          REPO_OWNER: HyDE-Project
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          FORK_OWNER: ${{ github.event.pull_request.head.repo.owner.login || '' }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -eu

          target_owner="$REPO_OWNER"
          target_branch="main"

          branch_exists() {
            git ls-remote --heads --exit-code "https://github.com/$1/tests.git" "refs/heads/$2" >/dev/null 2>&1
          }

          if branch_exists "$REPO_OWNER" "$BRANCH_NAME"; then
            target_owner="$REPO_OWNER"
            target_branch="$BRANCH_NAME"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$REPO_FULL" ] && [ -n "$FORK_OWNER" ] && branch_exists "$FORK_OWNER" "$BRANCH_NAME"; then
            target_owner="$FORK_OWNER"
            target_branch="$BRANCH_NAME"
          fi

          echo "owner=$target_owner" >> "$GITHUB_OUTPUT"
          echo "branch=$target_branch" >> "$GITHUB_OUTPUT"
          echo "Using tests from $target_owner/tests:$target_branch"

      - name: Checkout tests repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.resolve-tests.outputs.owner }}/tests
          ref: ${{ steps.resolve-tests.outputs.branch }}
          path: tests
          persist-credentials: false
          fetch-depth: 1

      - name: Require test suite
        run: test -f tests/run.sh

      - name: Install test dependencies
        run: |
          # Ubuntu-hosted runners may use a multi-line mirror+file URI whose
          # Azure archive hostname sometimes fails DNS. Replace the complete
          # Deb822 URI field, including continuation lines, before apt runs.
          sudo python3 - <<'PY'
          from pathlib import Path
          import re

          sources = Path("/etc/apt/sources.list.d/ubuntu.sources")
          stanzas = sources.read_text().strip().split("\n\n")
          rewritten = []
          for stanza in stanzas:
              suites = re.search(r"(?m)^Suites:\s*(.*)$", stanza)
              if not suites:
                  rewritten.append(stanza)
                  continue
              uri = "https://security.ubuntu.com/ubuntu" if "noble-security" in suites.group(1) else "https://archive.ubuntu.com/ubuntu"
              output = []
              skip_uri_continuation = False
              for line in stanza.splitlines():
                  if skip_uri_continuation and (not line or line[0].isspace()):
                      continue
                  skip_uri_continuation = False
                  if line.startswith("URIs:"):
                      output.append(f"URIs: {uri}")
                      skip_uri_continuation = True
                  else:
                      output.append(line)
              rewritten.append("\n".join(output))
          content = "\n\n".join(rewritten) + "\n"
          if "mirror+file:" in content:
              raise SystemExit("Ubuntu source still contains a mirror+file URI")
          sources.write_text(content)
          PY
          for attempt in 1 2 3; do
            if sudo apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=1 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && \
              sudo apt-get -o Acquire::Retries=1 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
                lua5.4 lua-filesystem lua-socket lua-argparse lua-dkjson shellcheck fish imagemagick; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to install test dependencies after $attempt attempts." >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
          sudo ln -sf /usr/bin/luac5.4 /usr/local/bin/luac

      - name: Report tool versions
        run: |
          lua -v
          shellcheck --version
          fish --version
          python3 --version

      - name: Run the test suite
        run: sh tests/run.sh

  coverage:
    name: Shell coverage
    runs-on: ubuntu-latest
    needs: test
    env:
      KCOV_VERSION: v43
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Resolve test repository and branch
        id: resolve-tests
        env:
          REPO_OWNER: HyDE-Project
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          FORK_OWNER: ${{ github.event.pull_request.head.repo.owner.login || '' }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -eu

          target_owner="$REPO_OWNER"
          target_branch="main"

          branch_exists() {
            git ls-remote --heads --exit-code "https://github.com/$1/tests.git" "refs/heads/$2" >/dev/null 2>&1
          }

          if branch_exists "$REPO_OWNER" "$BRANCH_NAME"; then
            target_owner="$REPO_OWNER"
            target_branch="$BRANCH_NAME"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$REPO_FULL" ] && [ -n "$FORK_OWNER" ] && branch_exists "$FORK_OWNER" "$BRANCH_NAME"; then
            target_owner="$FORK_OWNER"
            target_branch="$BRANCH_NAME"
          fi

          echo "owner=$target_owner" >> "$GITHUB_OUTPUT"
          echo "branch=$target_branch" >> "$GITHUB_OUTPUT"
          echo "Using tests from $target_owner/tests:$target_branch"

      - name: Checkout tests repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.resolve-tests.outputs.owner }}/tests
          ref: ${{ steps.resolve-tests.outputs.branch }}
          path: tests
          persist-credentials: false
          fetch-depth: 1

      - name: Install test and coverage dependencies
        run: |
          # Ubuntu-hosted runners may use a multi-line mirror+file URI whose
          # Azure archive hostname sometimes fails DNS. Replace the complete
          # Deb822 URI field, including continuation lines, before apt runs.
          sudo python3 - <<'PY'
          from pathlib import Path
          import re

          sources = Path("/etc/apt/sources.list.d/ubuntu.sources")
          stanzas = sources.read_text().strip().split("\n\n")
          rewritten = []
          for stanza in stanzas:
              suites = re.search(r"(?m)^Suites:\s*(.*)$", stanza)
              if not suites:
                  rewritten.append(stanza)
                  continue
              uri = "https://security.ubuntu.com/ubuntu" if "noble-security" in suites.group(1) else "https://archive.ubuntu.com/ubuntu"
              output = []
              skip_uri_continuation = False
              for line in stanza.splitlines():
                  if skip_uri_continuation and (not line or line[0].isspace()):
                      continue
                  skip_uri_continuation = False
                  if line.startswith("URIs:"):
                      output.append(f"URIs: {uri}")
                      skip_uri_continuation = True
                  else:
                      output.append(line)
              rewritten.append("\n".join(output))
          content = "\n\n".join(rewritten) + "\n"
          if "mirror+file:" in content:
              raise SystemExit("Ubuntu source still contains a mirror+file URI")
          sources.write_text(content)
          PY
          for attempt in 1 2 3; do
            if sudo apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=1 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && \
              sudo apt-get -o Acquire::Retries=1 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
                lua5.4 shellcheck fish imagemagick \
                binutils-dev build-essential cmake ninja-build libssl-dev \
                libcurl4-openssl-dev libelf-dev zlib1g-dev libdw-dev libiberty-dev; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to install test and coverage dependencies after $attempt attempts." >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
          sudo ln -sf /usr/bin/luac5.4 /usr/local/bin/luac

      - name: Build the coverage tool
        run: |
          git clone --depth 1 --branch "$KCOV_VERSION" https://github.com/SimonKagstrom/kcov.git "$RUNNER_TEMP/kcov"
          cmake -S "$RUNNER_TEMP/kcov" -B "$RUNNER_TEMP/kcov/build" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/kcov/build"
          sudo install -m 0755 "$RUNNER_TEMP/kcov/build/src/kcov" /usr/local/bin/kcov

      - name: Measure the suite
        run: |
          mkdir -p coverage
          kcov \
            --include-path=Scripts,Configs/.local/bin,Configs/.local/lib/hyde \
            --exclude-pattern=/tests/ \
            coverage sh tests/run.sh

      - name: Upload the report
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          flags: shell
          name: shell
          fail_ci_if_error: false

  arch:
    name: Arch package metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse Arch metadata in Arch Linux
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed python
              python3 .github/scripts/package-metadata.py pacman >/tmp/arch-packages
              mapfile -t packages </tmp/arch-packages
              pacman -Sp --noconfirm --needed "${packages[@]}" >/tmp/arch-transaction.log
              bash -n Scripts/install.sh Scripts/install_pre.sh Scripts/install_pst.sh \
                Scripts/restore_shl.sh Scripts/global_fn.sh
              test -s /tmp/arch-packages
            '

  fedora:
    name: Fedora 45 package metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve Fedora packages in Fedora 45
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            fedora:45 \
            bash -euo pipefail -c '
              dnf install -y dnf5-plugins python3
              dnf copr enable -y nett00n/hyprland
              dnf copr enable -y atim/starship
              python3 .github/scripts/package-metadata.py dnf >/tmp/fedora-packages
              mapfile -t packages </tmp/fedora-packages
              set +e
              dnf install --assumeno "${packages[@]}" >/tmp/fedora-transaction.log 2>&1
              status=$?
              set -e
              if grep -Eq "No match for argument|Failed to resolve the transaction|Problem:" /tmp/fedora-transaction.log; then
                cat /tmp/fedora-transaction.log
                exit 1
              fi
              grep -q "Transaction Summary" /tmp/fedora-transaction.log
              grep -q "Operation aborted by the user" /tmp/fedora-transaction.log
              test "$status" -ne 0
              tail -n 8 /tmp/fedora-transaction.log
              dnf install -y git cargo cmake make gcc-c++ pkgconf-pkg-config \
                hyprutils-devel lz4-devel libxkbcommon-devel wayland-devel \
                wayland-protocols-devel scdoc
              git clone --depth=1 https://github.com/HyDE-Project/hyprquery.git /tmp/hyprquery
              cmake -S /tmp/hyprquery -B /tmp/hyprquery/build \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/hyprquery-install
              cmake --build /tmp/hyprquery/build --parallel 2
              test -x /tmp/hyprquery/build/bin/hyq
              git clone --depth=1 --branch=v0.12.1 https://codeberg.org/LGFae/awww.git /tmp/awww
              cargo build --manifest-path /tmp/awww/Cargo.toml --release --jobs 2
              test -x /tmp/awww/target/release/awww
              test -x /tmp/awww/target/release/awww-daemon
              bash -n Scripts/install.sh Scripts/install_pre.sh Scripts/install_pst.sh \
                Scripts/restore_shl.sh Scripts/global_fn.sh
            '
