# Configuring hypridle
# See: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

$LOCK_CMD = hyde-shell lockscreen.sh
$UNLOCK_CMD = sh -c 'sleep 3 && pkill -9 $(hyde-shell lockscreen --get)'

general {
    lock_cmd = $LOCK_CMD
    unlock_cmd = $UNLOCK_CMD
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Keep safe dimming while automatic locking is mitigated.
listener {
    timeout = 60
    on-timeout = brightnessctl -s && brightnessctl s 1%
    on-resume = brightnessctl -r
}

# Automatic lock, DPMS-off and suspend are temporarily disabled because
# hyprlock 0.9.6 stopped accepting input on this dual-monitor NVIDIA system.
# Keep these actions together: suspending or turning displays off without a
# reliable lock would either expose the resumed session or retrigger the bug.
# Manual locking remains available for controlled testing.
