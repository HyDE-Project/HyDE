# Swipe threshold (0-100)
swipe_threshold 0

# Gestures
# Pinch clockwise / anticlockwise: volume up / down by 10
gesture pinch clockwise 4 hyde-shell volumecontrol -o i 10
gesture pinch anticlockwise 4 hyde-shell volumecontrol -o d 10
# Swipe up: toggle fullscreen
gesture swipe up 4 hyprctl dispatch 'hl.dsp.window.fullscreen()'
# Swipe down: screenshot of all monitor outputs
gesture swipe down 4 hyde-shell screenshot p
# Swipe right: close rofi if open, otherwise open the clipboard history
gesture swipe right 4 sh -c 'pkill -x rofi || hyde-shell cliphist -c'
# Swipe left: show the last notification again
gesture swipe left 4 dunstctl history-pop
# Pinch out / in: brightness up / down
gesture pinch out 4 hyde-shell brightnesscontrol i
gesture pinch in 4 hyde-shell brightnesscontrol d
