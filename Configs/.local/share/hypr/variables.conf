$scrPath=$HOME/.local/lib/doorwayde # set scripts path
$&=override # shorthand for override flag

# Main modifier
$mainMod = SUPER # windows key
$MOD = SUPER
$QUICKAPPS =
$BROWSER = doorwayde-shell open --fall firefox web-browser
$EDITOR = doorwayde-shell open --fall code-oss text-editor
$EXPLORER= doorwayde-shell open --fall dolphin file-manager
$TERMINAL = doorwayde-shell app -T
$LOCKSCREEN = hyprlock
$KILLACTIVE = hyprctl dispatch killactive ""

# // █░░ ▄▀█ █░█ █▄░█ █▀▀ █░█
# // █▄▄ █▀█ █▄█ █░▀█ █▄▄ █▀█

# See https://wiki.hypr.land/Configuring/Keywords/


$list.environment=WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP XDG_CONFIG_HOME QT_QPA_PLATFORMTHEME
$unt="doorwayde-$XDG_SESSION_DESKTOP" # Holder for the unit name
$svc="service" # Holder for the service command
$scp="scope" # Holder for the scope command

$start.DBUS_SHARE_PICKER=dbus-update-activation-environment --systemd $list.environment # for XDPH
$start.SYSTEMD_SHARE_PICKER=systemctl --user import-environment $list.environment # for XDPH ( redundant with the first one )

$start.XDG_PORTAL_RESET=doorwayde-shell resetxdgportal.sh
$start.AUTH_DIALOGUE=doorwayde-shell app -t $svc -- polkitkdeauth.sh

$start.IDLE_DAEMON=doorwayde-shell app -u $unt-idle.service -t $svc -- hypridle
$start.BLUE_LIGHT_FILTER_DAEMON=doorwayde-shell app -u $unt-blue-light-filter.service -t $svc -- hyprsunset
$start.TEXT_CLIPBOARD=doorwayde-shell app -u $unt-text-clipboard.service -t $svc wl-paste --type text --watch cliphist store
$start.IMAGE_CLIPBOARD=doorwayde-shell app -u $unt-image-clipboard.service -t $svc wl-paste --type image --watch cliphist store
$start.CLIPBOARD_PERSIST=doorwayde-shell app -u $unt-clipboard-persist.service -t $svc wl-clip-persist --clipboard regular

$start.WALLPAPER=doorwayde-shell app -u $unt-wallpaper.service -t $svc -- wallpaper.sh --start --global
$start.BAR=doorwayde-shell app -u $unt-bar.scope -t $scp -- waybar.py --watch # waybar.py injects it itself as -u $unt.service :- therefore we use scope here to avoid conflicts
$start.NOTIFICATIONS=doorwayde-shell app -u $unt-notifications.service -t $svc -- dunst
$start.BATTERY_NOTIFY=doorwayde-shell app -u $unt-battery-notify.service -t $svc -- batterynotify.sh


$start.APPLET_NETWORK_MANAGER=doorwayde-shell app -u $unt-network-manager-applet.service -t $svc -- nm-applet --indicator
$start.APPLET_REMOVABLE_MEDIA=doorwayde-shell app -u $unt-removable-media-applet.service -t $svc -- udiskie --no-automount --smart-tray
$start.APPLET_BLUETOOTH=doorwayde-shell app -u $unt-bluetooth-applet.service -t $svc -- blueman-applet

# Unset
$unt=""
$svc=""
$scp=""


